name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      SIGNALDRAFT_LLM_MODE: heuristic
      SIGNALDRAFT_FALLBACK_TO_RULES: "true"
      SIGNALDRAFT_API_TOKEN: test-api-token
      SIGNALDRAFT_ADMIN_PASSWORD: test-admin-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: pytest

      - name: Run local evaluation
        run: python scripts/run_eval.py
